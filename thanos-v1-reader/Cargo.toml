[package]
name = "thanos-v1-reader"
version = "0.1.0"
edition = "2024"

[[test]]
name = "e2e"
path = "e2e/e2e.rs"

[[test]]
name = "native_histogram_parity"
path = "e2e/native_histogram_parity.rs"

[[test]]
name = "raw_scalar_parity"
path = "e2e/raw_scalar_parity.rs"

[[test]]
name = "scalar_downsample_parity"
path = "e2e/scalar_downsample_parity.rs"

[[test]]
name = "native_histogram_downsample_parity"
path = "e2e/native_histogram_downsample_parity.rs"

[[test]]
name = "native_histogram_query_parity"
path = "e2e/native_histogram_query_parity.rs"

[[test]]
name = "block_selection_parity"
path = "e2e/block_selection_parity.rs"

[dependencies]
arrow = "58.4.0"
arrow-flight = { version = "58.4.0", features = ["flight-sql"] }
async-trait = "0.1.92"
axum = "0.8.9"
crc = "3.4.0"
datafusion = "54.1.0"
datafusion-tracing = "54.0.0"
futures = "0.3.34"
metrics-exporter-prometheus = "0.18.3"
opendal = { version = "0.58.2", features = ["layers-metrics", "layers-otel-trace", "services-fs"] }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.32.1"
parquet = "58.4.0"
prost = "0.14.4"
prost-types = "0.14.4"
regex = "1.13.1"
rusty-chunkenc = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
toml = "1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
