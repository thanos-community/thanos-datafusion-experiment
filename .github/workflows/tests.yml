name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thanos-block-gen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: thanos-block-gen/go.mod
          cache: true
          cache-dependency-path: thanos-block-gen/go.sum
      - run: go test ./...

  rust-unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    defaults:
      run:
        working-directory: thanos-v1-reader
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thanos-v1-reader -> target
          cache-targets: false
      - run: cargo test --lib
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats

  rust-e2e-tests:
    name: Rust end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thanos-v1-reader
    env:
      OTEL_SDK_DISABLED: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: thanos-block-gen/go.mod
          cache: true
          cache-dependency-path: thanos-block-gen/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thanos-v1-reader -> target
          cache-targets: false
      - run: cargo test --test e2e
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats
