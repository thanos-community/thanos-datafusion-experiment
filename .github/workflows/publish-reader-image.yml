---
name: Reader image

"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  # `pull_request` builds trusted same-repository heads, while `pull_request_target`
  # handles forks. Both events fire for an internal PR; keeping them in separate
  # groups prevents the skipped target run from cancelling the real image build.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select build platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Select matrix
        id: matrix
        run: |
          if [ "${EVENT_NAME}" = push ]; then
            echo 'value={"include":[{"platform":"linux/amd64","platform_pair":"linux-amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","platform_pair":"linux-arm64","runner":"ubuntu-24.04-arm"}]}' >> "${GITHUB_OUTPUT}"
          else
            echo 'value={"include":[{"platform":"linux/amd64","platform_pair":"linux-amd64","runner":"ubuntu-latest"}]}' >> "${GITHUB_OUTPUT}"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}

  build:
    name: Build image (${{ matrix.platform }})
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    needs:
      - plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare pull request image tag
        id: pr_image
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            echo "tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          else
            short_sha="${PR_HEAD_SHA::7}"
            echo "tag=pr-${PR_NUMBER}-${short_sha}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thanos-community/thanos-v1-reader
          flavor: ${{ github.event_name == 'push' && format('suffix=-{0}', matrix.platform_pair) || '' }}
          tags: |
            type=raw,value=${{ steps.pr_image.outputs.tag }},enable=${{ github.event_name != 'push' }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.description=Thanos StoreAPI reader backed by Apache DataFusion
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./thanos-v1-reader
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=reader-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=reader-${{ matrix.platform_pair }}
          provenance: mode=max

      - name: Export image digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifest
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thanos-community/thanos-v1-reader
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf 'ghcr.io/thanos-community/thanos-v1-reader@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/thanos-community/thanos-v1-reader:${{ steps.meta.outputs.version }}
