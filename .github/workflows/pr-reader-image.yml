---
name: PR reader image

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build amd64 PR image
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tag
        id: image
        run: |
          short_sha="${PR_HEAD_SHA::7}"
          tag="pr-${PR_NUMBER}-${short_sha}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/thanos-community/thanos-v1-reader:${tag}" >> "${GITHUB_OUTPUT}"
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Build and publish amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./thanos-v1-reader
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.description=Thanos StoreAPI reader backed by Apache DataFusion
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=reader-linux-amd64
          cache-to: type=gha,mode=max,scope=reader-linux-amd64
          provenance: mode=max

      - name: Show published image
        run: |
          echo "Published ${IMAGE}"
        env:
          IMAGE: ${{ steps.image.outputs.image }}
